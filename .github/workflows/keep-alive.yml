name: Keep Supabase awake
on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/courses?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"
